<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>syro</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --line: #2a2f38; --text: #e6e8ec;
    --dim: #9aa2af; --idle: #6b7280; --working: #3fb950; --permission: #d29922;
    --accent: #4493f8; --danger: #f85149;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --line: #e2e5ea; --text: #16181d;
      --dim: #626a76; --idle: #9aa2af; --working: #1a7f37; --permission: #9a6700;
      --accent: #0969da; --danger: #cf222e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, "Helvetica Neue", "PingFang SC", system-ui, sans-serif;
    padding: max(12px, env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  header .hint { color: var(--dim); font-size: 12px; margin-left: auto; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 10px;
  }
  .row { display: flex; align-items: center; gap: 8px; }
  .row + .row { margin-top: 8px; }
  .grow { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .branch, .meta { color: var(--dim); font-size: 12px; }
  .task { font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--idle); flex: none; }
  .dot.working { background: var(--working); }
  .dot.permission { background: var(--permission); }
  .dot.stalled { box-shadow: 0 0 0 3px color-mix(in srgb, var(--permission) 30%, transparent); }
  button {
    font: inherit; color: var(--text); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px;
    min-height: 34px; cursor: pointer;
  }
  button:active { background: color-mix(in srgb, var(--text) 8%, transparent); }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button.danger { border-color: var(--danger); color: var(--danger); }
  button.key { min-width: 46px; padding: 9px 8px; font-family: ui-monospace, monospace; }
  input, select {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 36px;
    width: 100%; min-width: 0;
  }
  pre {
    background: #0d0f12; color: #d7dbe0; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; margin: 8px 0; overflow: auto; max-height: 46vh;
    font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre; -webkit-overflow-scrolling: touch;
  }
  @media (prefers-color-scheme: light) { pre { background: #f2f3f5; color: #16181d; } }
  .keys { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  /* The full terminal: a sized box for xterm.js to measure itself against. */
  #t-full { height: 46vh; margin: 8px 0; }
  #t-full .xterm { height: 100%; }
  .send { display: flex; gap: 6px; }
  .send button { flex: none; }
  .muted { color: var(--dim); font-size: 12px; }
  .err { color: var(--danger); font-size: 13px; margin-bottom: 10px; }
  details > summary { cursor: pointer; color: var(--dim); font-size: 13px; }
  details { margin-bottom: 10px; }
  details form { margin-top: 10px; display: grid; gap: 8px; }
  .label { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>syro</h1>
  <span class="hint" id="hint"></span>
</header>
<div id="error" class="err" hidden></div>
<div id="list"></div>

<section class="card" id="terminal" hidden>
  <div class="row">
    <span class="dot" id="t-dot"></span>
    <span class="grow ellipsis"><b id="t-name"></b> <span class="muted" id="t-task"></span></span>
    <button id="t-full-btn"></button>
    <button id="t-close"></button>
  </div>
  <div id="t-full" hidden></div>
  <div id="t-simple">
  <pre id="t-text"></pre>
  <div class="keys" id="t-keys"></div>
  <div class="send">
    <input id="t-input" placeholder="…" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="primary" id="t-send"></button>
  </div>
</section>
<details class="card">
  <summary id="new-summary"></summary>
  <form id="new-form">
    <div>
      <div class="label" id="new-repo-label"></div>
      <input id="new-repo" list="repos" autocapitalize="off" autocorrect="off" spellcheck="false">
      <datalist id="repos"></datalist>
    </div>
    <div>
      <div class="label" id="new-name-label"></div>
      <input id="new-name" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <button class="primary" type="submit" id="new-create"></button>
  </form>
</details>

<details class="card">
  <summary id="term-summary"></summary>
  <form id="term-form">
    <div>
      <div class="label" id="term-worktree-label"></div>
      <select id="term-worktree"></select>
    </div>
    <div>
      <div class="label" id="term-agent-label"></div>
      <select id="term-agent"></select>
    </div>
    <button class="primary" type="submit" id="term-create"></button>
  </form>
</details>

<script>
const ZH = String("__syro_locale__" || navigator.language || "")
  .toLowerCase()
  .startsWith("zh");
const T = ZH ? {
  poll: "实时", updated: "已更新", notUpdated: "未连接",
  noWorktrees: "还没有工作树。",
  open: "打开", remove: "删除", removeAsk: "删除这个工作树？",
  copy: "复制会话命令", copied: "已复制",
  close: "关闭", send: "发送",
  full: "完整终端", simple: "简洁视图", ended: "[终端已结束]",
  new: "新建工作树", repo: "仓库（名字或 id）", name: "工作树名字", create: "创建",
  newTerminal: "新建终端", worktree: "工作树", agent: "Agent", start: "启动",
  shell: "普通 shell",
  keys: {
    enter: "回车", esc: "Esc", tab: "Tab", backspace: "退格", space: "空格",
    up: "↑", down: "↓", left: "←", right: "→", "ctrl-c": "Ctrl-C", "ctrl-d": "Ctrl-D",
  },
} : {
  poll: "live", updated: "updated", notUpdated: "not connected",
  noWorktrees: "No worktrees yet.",
  open: "Open", remove: "Remove", removeAsk: "Remove this worktree?",
  copy: "Copy resume command", copied: "Copied",
  close: "Close", send: "Send",
  full: "Full terminal", simple: "Simple view", ended: "[the terminal ended]",
  new: "New worktree", repo: "Repository (name or id)", name: "Worktree name", create: "Create",
  newTerminal: "New terminal", worktree: "Worktree", agent: "Agent", start: "Start",
  shell: "Plain shell",
  keys: {
    enter: "Enter", esc: "Esc", tab: "Tab", backspace: "Backspace", space: "Space",
    up: "↑", down: "↓", left: "←", right: "→", "ctrl-c": "Ctrl-C", "ctrl-d": "Ctrl-D",
  },
};
// The keys the panel offers as buttons, in the order they are drawn.
const KEYS = ["enter", "esc", "tab", "up", "down", "left", "right", "ctrl-c", "y", "n"];

let listing = { worktrees: [] };
// The presets the panel may start, from `/api/agents`; fetched once.
let agents = [];

function say(message) {
  const box = document.getElementById("error");
  box.textContent = message || "";
  box.hidden = !message;
}

async function api(path, options) {
  const response = await fetch(path, Object.assign({
    headers: { "content-type": "application/json" },
  }, options));
  const text = await response.text();
  if (!response.ok) throw new Error(text || (options && options.method || "GET") + " " + path);
  return text;
}

function post(path, body) {
  return api(path, { method: "POST", body: JSON.stringify(body) });
}

function dot(status, stalled) {
  const el = document.createElement("span");
  el.className = "dot" + (status ? " " + status : "") + (stalled ? " stalled" : "");
  return el;
}

function render() {
  const list = document.getElementById("list");
  list.textContent = "";
  const worktrees = listing.worktrees || [];
  if (!worktrees.length) {
    const empty = document.createElement("p");
    empty.className = "muted";
    empty.textContent = T.noWorktrees;
    list.append(empty);
    return;
  }
  const repos = new Set();
  for (const wt of worktrees) {
    repos.add(wt.repo);
    const card = document.createElement("div");
    card.className = "card";

    const head = document.createElement("div");
    head.className = "row";
    head.append(dot(wt.status, wt.stalled));
    const title = document.createElement("span");
    title.className = "grow ellipsis";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = wt.name;
    const branch = document.createElement("span");
    branch.className = "branch";
    branch.textContent = " " + wt.repo + " · " + wt.branch;
    title.append(name, branch);
    head.append(title);
    const remove = document.createElement("button");
    remove.className = "danger";
    remove.textContent = T.remove;
    remove.onclick = async () => {
      if (!confirm(T.removeAsk)) return;
      try { await post("/api/worktrees/remove", { id: wt.id }); refresh(); }
      catch (error) { say(String(error.message)); }
    };
    head.append(remove);
    card.append(head);

    for (const terminal of wt.terminals || []) {
      const row = document.createElement("div");
      row.className = "row";
      row.append(dot(terminal.status, terminal.stalled));
      const label = document.createElement("span");
      label.className = "grow ellipsis";
      const who = terminal.agent_name || terminal.agent || terminal.id;
      label.textContent = who + (terminal.task ? " · " + terminal.task : "");
      row.append(label);
      if (terminal.resume) {
        const copy = document.createElement("button");
        copy.textContent = T.copy;
        copy.onclick = async () => {
          try { await navigator.clipboard.writeText(terminal.resume); copy.textContent = T.copied; }
          catch { say(terminal.resume); }
          setTimeout(() => { copy.textContent = T.copy; }, 1500);
        };
        row.append(copy);
      }
      const open = document.createElement("button");
      open.className = "primary";
      open.textContent = T.open;
      open.onclick = () => openTerminalView(terminal);
      row.append(open);
      card.append(row);
    }
    list.append(card);
  }
  const datalist = document.getElementById("repos");
  datalist.textContent = "";
  for (const repo of repos) {
    const option = document.createElement("option");
    option.value = repo;
    datalist.append(option);
  }

  // The worktree picker for a new terminal. Its choice is kept across the poll
  // that just rebuilt the list, or it would jump back to the first row twice a
  // second while a thumb is on it.
  const picker = document.getElementById("term-worktree");
  const chosen = picker.value;
  picker.textContent = "";
  for (const wt of worktrees) {
    const option = document.createElement("option");
    option.value = wt.id;
    option.textContent = wt.repo + " / " + wt.name;
    picker.append(option);
  }
  if (worktrees.some((wt) => wt.id === chosen)) picker.value = chosen;
}

// The agent picker never changes: it is the app's presets, not the current run.
async function loadAgents() {
  try {
    agents = JSON.parse(await api("/api/agents"));
  } catch (error) {
    return;
  }
  const picker = document.getElementById("term-agent");
  const shell = document.createElement("option");
  shell.value = "";
  shell.textContent = T.shell;
  picker.append(shell);
  for (const agent of agents) {
    const option = document.createElement("option");
    option.value = agent.id;
    option.textContent = agent.name;
    picker.append(option);
  }
}

function applyState(next) {
  listing = next;
  document.getElementById("hint").textContent = T.poll + " · " + T.updated + " " +
    new Date().toLocaleTimeString();
  say("");
  // A terminal that is gone — its tab closed, its worktree removed — closes the
  // view here rather than polling a 404 for as long as the page is open.
  if (shown && !listing.worktrees.some((wt) =>
    (wt.terminals || []).some((terminal) => terminal.id === shown.id))) {
    shown = null;
    closeFullTerminal();
    document.getElementById("terminal").hidden = true;
  }
  render();
}

async function refresh() {
  try {
    applyState(JSON.parse(await api("/api/state")));
  } catch (error) {
    document.getElementById("hint").textContent = T.notUpdated;
    say(String(error.message || error));
  }
}

// The state is pushed, not polled: the app sends it when it changes and says
// nothing otherwise, so a phone in a pocket is not woken every two seconds to be
// told the same thing. `EventSource` reconnects on its own after a drop.
function watchState() {
  if (!window.EventSource) return false;
  const stream = new EventSource("/api/state/stream");
  stream.addEventListener("state", (event) => {
    try {
      applyState(JSON.parse(event.data));
    } catch (error) {
      say(String(error.message || error));
    }
  });
  return true;
}

// The open terminal, if any: what the key buttons and the input send to.
let shown = null;

function openTerminalView(terminal) {
  // Whatever the last terminal left behind, before this one reuses the box.
  closeFullTerminal();
  shown = terminal;
  document.getElementById("terminal").hidden = false;
  document.getElementById("t-name").textContent = terminal.agent_name || terminal.agent || terminal.id;
  document.getElementById("t-task").textContent = terminal.task || "";
  document.getElementById("t-dot").className = "dot" + (terminal.status ? " " + terminal.status : "") +
    (terminal.stalled ? " stalled" : "");
  document.getElementById("terminal").scrollIntoView({ block: "nearest" });
  loadText();
}

// --- the full terminal ------------------------------------------------------
//
// xterm.js, fetched only when asked for: 291 KiB has no business loading for a
// page whose job is to say whether an agent is working.

let library = null;
let term = null;
let fit = null;
let stream = null;

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = src;
    script.onload = resolve;
    script.onerror = () => reject(new Error("could not load " + src));
    document.head.append(script);
  });
}

async function loadLibrary() {
  if (library) return library;
  const css = document.createElement("link");
  css.rel = "stylesheet";
  css.href = "/xterm.css";
  document.head.append(css);
  await loadScript("/xterm.js");
  await loadScript("/xterm-addon-fit.js");
  // The UMD builds differ in how they name the addon: take whichever it is.
  library = {
    Terminal: window.Terminal,
    FitAddon: (window.FitAddon && window.FitAddon.FitAddon) || window.FitAddon,
  };
  return library;
}

function fromHex(text) {
  const bytes = new Uint8Array(text.length / 2);
  for (let at = 0; at < bytes.length; at++) {
    bytes[at] = parseInt(text.slice(at * 2, at * 2 + 2), 16);
  }
  return bytes;
}

function terminalPath(leaf) {
  return "/api/terminal/" + encodeURIComponent(shown.id) + "/" + leaf;
}

function sendSize() {
  if (!term) return;
  post(terminalPath("resize"), { cols: term.cols, rows: term.rows })
    .catch((error) => say(String(error.message || error)));
}

async function openFullTerminal() {
  if (!shown || term) return;
  document.getElementById("t-full").hidden = false;
  document.getElementById("t-simple").hidden = true;
  document.getElementById("t-full-btn").textContent = T.simple;
  try {
    const { Terminal, FitAddon } = await loadLibrary();
    term = new Terminal({ fontSize: 12, scrollback: 4000 });
    fit = new FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById("t-full"));
    fit.fit();
    term.onData((data) => {
      post(terminalPath("input"), { text: data })
        .catch((error) => say(String(error.message || error)));
    });
    // The child is told the size this screen actually has; a TUI drawing for a
    // window nobody is looking at is worse than one that redraws.
    sendSize();
    stream = new EventSource(terminalPath("stream"));
    stream.addEventListener("paint", (event) => term.write(fromHex(event.data)));
    stream.addEventListener("bytes", (event) => term.write(fromHex(event.data)));
    stream.addEventListener("end", () => {
      term.write("\r\n" + T.ended + "\r\n");
      // Closed explicitly: an `EventSource` reconnects on its own, and this one
      // would reconnect forever to a terminal that has ended.
      if (stream) { stream.close(); stream = null; }
    });
    term.focus();
  } catch (error) {
    // Back to the view that always works rather than an empty box.
    say(String(error.message || error));
    closeFullTerminal();
  }
}

function closeFullTerminal() {
  if (stream) { stream.close(); stream = null; }
  // Disposing is what drops the bytes' reader, which is how the app's reader
  // thread stops writing into a queue nobody reads.
  if (term) { term.dispose(); term = null; }
  fit = null;
  document.getElementById("t-full").hidden = true;
  document.getElementById("t-simple").hidden = false;
  document.getElementById("t-full-btn").textContent = T.full;
}

async function loadText() {
  if (!shown) return;
  try {
    const text = await api("/api/terminal/" + encodeURIComponent(shown.id) + "/snapshot");
    const pre = document.getElementById("t-text");
    // Only scroll to the bottom when it was already there: a reader scrolled up
    // must not be yanked back down by the next poll.
    const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 24;
    pre.textContent = text;
    if (atBottom) pre.scrollTop = pre.scrollHeight;
  } catch (error) {
    say(String(error.message || error));
  }
}

async function sendKeys(keys) {
  if (!shown) return;
  try { await post("/api/terminal/" + encodeURIComponent(shown.id) + "/input", { keys }); }
  catch (error) { say(String(error.message || error)); }
  loadText();
}

function buildKeys() {
  const box = document.getElementById("t-keys");
  box.textContent = "";
  for (const key of KEYS) {
    const button = document.createElement("button");
    button.className = "key";
    button.textContent = T.keys[key] || key;
    button.onclick = () => sendKeys([key]);
    box.append(button);
  }
}

document.getElementById("t-close").textContent = T.close;
document.getElementById("t-send").textContent = T.send;
document.getElementById("t-full-btn").textContent = T.full;
document.getElementById("new-summary").textContent = T.new;
document.getElementById("new-repo-label").textContent = T.repo;
document.getElementById("new-name-label").textContent = T.name;
document.getElementById("new-create").textContent = T.create;
document.getElementById("term-summary").textContent = T.newTerminal;
document.getElementById("term-worktree-label").textContent = T.worktree;
document.getElementById("term-agent-label").textContent = T.agent;
document.getElementById("term-create").textContent = T.start;

document.getElementById("t-close").onclick = () => {
  shown = null;
  closeFullTerminal();
  document.getElementById("terminal").hidden = true;
};

document.getElementById("t-full-btn").onclick = () => {
  if (term) closeFullTerminal();
  else openFullTerminal();
};

// The phone turning sideways is a new grid size, and the child has to hear it.
window.addEventListener("resize", () => {
  if (!term || !fit) return;
  fit.fit();
  sendSize();
});

document.getElementById("t-send").onclick = async () => {
  const input = document.getElementById("t-input");
  if (!input.value || !shown) return;
  const text = input.value;
  input.value = "";
  try { await post("/api/terminal/" + encodeURIComponent(shown.id) + "/input", { text }); }
  catch (error) { say(String(error.message || error)); }
  input.focus();
  loadText();
};

document.getElementById("new-form").onsubmit = async (event) => {
  event.preventDefault();
  const repo = document.getElementById("new-repo").value.trim();
  const name = document.getElementById("new-name").value.trim();
  if (!repo || !name) return;
  try {
    await post("/api/worktrees", { repo, name });
    document.getElementById("new-name").value = "";
    say("");
    setTimeout(refresh, 800);
  } catch (error) {
    say(String(error.message || error));
  }
};

document.getElementById("term-form").onsubmit = async (event) => {
  event.preventDefault();
  const worktree = document.getElementById("term-worktree").value;
  const agent = document.getElementById("term-agent").value;
  if (!worktree) return;
  const body = { worktree };
  if (agent) body.agent = agent;
  try {
    await post("/api/terminals", body);
    say("");
    // An agent takes a moment to write its first transcript; the tab shows up
    // either way, so one later poll is enough.
    setTimeout(refresh, 600);
  } catch (error) {
    say(String(error.message || error));
  }
};

buildKeys();
loadAgents();
if (!watchState()) {
  // No `EventSource`: the poll this replaced still works, just less politely.
  refresh();
  setInterval(refresh, 2000);
}
// The simple terminal view is polled while it is open — that is a page someone is
// looking at, not a page in a pocket.
setInterval(() => { if (shown && !term) loadText(); }, 1200);
</script>
</body>
</html>
