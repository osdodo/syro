[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# --- gpui-kit: one git tag, never crates.io ---
# Every gpui-* crate in the build is the same commit, which is what keeps
# gpui-base and gpui-kit from being two different versions of each other.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.7.1", features = [
  # The editor highlights with these, and only these: one grammar per language
  # `crates/app/src/opener.rs` names. `tree-sitter-languages` would pull the
  # other twenty-odd grammars into the binary for languages this app cannot name.
  "tree-sitter",
  "tree-sitter-bash",
  "tree-sitter-c",
  "tree-sitter-cpp",
  "tree-sitter-css",
  "tree-sitter-diff",
  "tree-sitter-go",
  "tree-sitter-html",
  "tree-sitter-java",
  "tree-sitter-javascript",
  "tree-sitter-markdown",
  "tree-sitter-python",
  "tree-sitter-ruby",
  "tree-sitter-rust",
  "tree-sitter-toml",
  "tree-sitter-tsx",
  "tree-sitter-typescript",
  "tree-sitter-yaml",
] }

# --- syro-core deps ---
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"

# --- i18n ---
# The same crate gpui-kit's components translate with, so one `set_locale`
# reaches our strings and theirs: the global locale lives in rust-i18n itself.
rust-i18n = "4.2.0"
# The system's language, for "follow the system" on start-up.
sys-locale = "0.3"

# --- syro-core: terminal ---
alacritty_terminal = { version = "0.26", default-features = false }
portable-pty = "0.9"

# gpui is unusably slow at opt-level 0 in dev; gpui-kit requires opt-level 3.
# `package."*"` covers every dependency (gpui-pre among them) but leaves our own
# workspace crates at the default so they still build fast.
[profile.dev]
debug = "limited"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
